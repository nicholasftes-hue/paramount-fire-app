<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paramount isolated sync test</title><body><p id="startup">Opening isolated test workspace…</p>
<script>
(async()=>{
  try{
    if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname))throw Error();
    // Separate entry point: never loads normal auth UI, Academy or service worker.
    const response=await fetch('./index-3.html',{cache:'no-store'});if(!response.ok)throw Error();
    let html=await response.text();
    html=html.replace(/<script\b[^>]*\bsrc=["'][^"']+["'][^>]*>\s*<\/script>/gi,'');
    html=html.replace('</body>','<script src="./team-sync.js"><\/script><script src="./team-sync-ui.js"><\/script><script src="./pdf-font.js"><\/script><script src="./main-app.js"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch{document.getElementById('startup').textContent='Test workspace unavailable. Serve this checkout locally and retry.'}
})();
</script></body></html>
