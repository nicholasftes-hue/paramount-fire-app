<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Paramount Fire Protection | Service Hub</title>
<style>
:root{color-scheme:light}body{margin:0;background:#fff;color:#173b5c;font:16px system-ui,sans-serif}main{max-width:650px;margin:12vh auto;padding:24px;text-align:center}.spinner{width:30px;height:30px;border:3px solid #d8effa;border-top-color:#1398d2;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><main id="loading"><h1>Paramount Fire Protection</h1><p>Opening your service hub…</p><div class="spinner"></div></main>
<script>
(async()=>{
  try {
    // The existing white V9 app is already in the same GitHub Pages folder.
    // Fetch it fresh so the dark version cannot be supplied by browser cache.
    const response=await fetch('./index-3.html?white-dashboard-v9=main-app-1',{cache:'no-store'});
    if(!response.ok) throw new Error('White dashboard file not found ('+response.status+')');
    let html=await response.text();
    if(!html.includes('WHITE DASHBOARD')||!html.includes('home-hero')) throw new Error('The published file is not the expected white dashboard.');
    // Keep the existing application logic, Supabase setup, and forms intact.
    // Ensure the new dashboard is shown even if an older theme was saved.
    const extra=`<style id="paramount-white-theme">
      html,body,main{background:#fff!important;color:#193b57!important}
      header{background:#fff!important;color:#102c48!important;border-bottom:3px solid #76c9ef!important}
      .brand h1{color:#102c48!important}.brand h1 span{color:#138dca!important}
      .brand small,.brand .tagline{color:#3289b9!important}
      .home-hero{background:#edf8ff!important;border-color:#cce9f8!important}
      .home-tile,.home-tile.fire,.home-tile.pat,.home-tile.lighting,.home-panel,.panel{background:#fff!important;color:#123956!important}
      .home-nav,.tabs,.introbar{background:#fff!important}
    </style>`;
    html=html.replace('</head>',extra+'</head>');
    // Load external modules explicitly after the replacement document exists.
    // document.write external-script timing differs from direct page navigation.
    const modules = [];
    html = html.replace(/<script\b([^>]*\bsrc=["']([^"']+)["'][^>]*)>\s*<\/script>/gi, (tag, attributes, src) => {
      modules.push(src);
      return '';
    });
    document.open();document.write(html);document.close();
    for (const src of modules) {
      await new Promise(resolve => {
        const script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = resolve;
        script.onerror = () => {
          const status = document.getElementById('academy-status');
          if (status && src.includes('academy.js')) status.textContent = 'Academy could not load. Check your connection and reload, or open academy-test.html.';
          resolve(); // A module failure must not remove the working service app.
        };
        document.body.append(script);
      });
    }
  }catch(err){
    const loading = document.getElementById('loading');
    if (!loading) { console.error('App loader failed after document replacement', err); return; }
    loading.innerHTML='<h1>Paramount Fire Protection</h1><p>The white dashboard could not be opened.</p><p id="err"></p><p><a href="./index-3.html?direct=1">Try opening the white dashboard directly</a></p>';
    document.getElementById('err').textContent=err.message;
  }
})();
</script></body></html>
