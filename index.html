body{background:#f4f8fc}body:has(.home-hero) header{background:#fff;border-bottom:1px solid #dce8f1;box-shadow:0 2px 14px #1234540b;color:#102c48}body:has(.home-hero) .brandmark{display:none}body:has(.home-hero) .brand h1{color:#102c48}body:has(.home-hero) .brand .tagline{color:#1889ca}body:has(.home-hero) .brand small{color:#54748c}body:has(.home-hero) .brand h1 span{color:#1595d5!important}body:has(.home-hero) .introbar,body:has(.home-hero) .tabs{display:none}body:has(.home-hero) main{max-width:1120px;padding:18px 16px 35px}.home-hero{background:linear-gradient(115deg,#e5f4ff,#fff);border:1px solid #d8e9f5;border-radius:20px;padding:27px 28px}.home-eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#1986c2}.home-hero h2{font-size:clamp(26px,4vw,38px);color:#112f4d;margin:6px 0 4px;line-height:1.2}.home-hero h2 span{color:#1699df}.home-hero p{margin:0;color:#54748c}.home-status{display:inline-flex;align-items:center;gap:7px;margin-top:20px;background:#fff;border:1px solid #d4e8f3;border-radius:30px;padding:7px 12px;font-size:12px;color:#365d75;font-weight:650}.home-dot{width:8px;height:8px;border-radius:50%;background:#20ad91}.home-heading{margin:24px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.home-heading h3{margin:0;font-size:19px;color:#123350}.home-heading small{font-size:12px}.home-services,.home-management,.home-extra{display:grid;gap:12px}.home-services{grid-template-columns:repeat(3,minmax(0,1fr))}.home-management{grid-template-columns:repeat(4,minmax(0,1fr))}.home-extra{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}.home-tile{display:flex;align-items:center;gap:11px;min-width:0;padding:20px 14px;background:#fff;border:1px solid #dce8f1;border-radius:17px;text-align:left;color:#123350;box-shadow:0 5px 18px #153b590a;transition:transform .12s}.home-tile:hover{filter:none;transform:translateY(-2px);border-color:#8bcdef}.home-tile.fire{background:#fff4f2}.home-tile.pat{background:#effaf5}.home-ti const sections=['Dashboard','Properties','Service Records','Inventory','PAT Testing','Emergency Lighting','Planner','Job Packs','Quotes','Documents','Cloud Properties'];let tab='Dashboard';const key='paramount-demo-v1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch(e){}db=db||{properties:[{id:'P001',name:'Demo HMO — Bury',panel:'C-TEC Conventional',last:'2026-04-21',months:6},{id:'P002',name:'Demo HMO — Bolton',panel:'Conventional panel',last:'2026-05-02',months:6}],services:[],inventory:[],pat:[],quotes:[],lighting:[],jobs:[],settings:{patRate:'',fireRate:'',lightingRate:'',vat:'0'}};db.lighting=db.lighting||[];db.jobs=db.jobs||[];db.settings=db.settings||{patRate:'',fireRate:'',lightingRate:'',vat:'0'};function save(){localStorage.setItem(key,JSON.stringify(db));render()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateDue(p){let d=new Date(p.last+'T12:00:00');d.setMonth(d.getMonth()+Number(p.months));return d}function days(d){return Math.ceil((d-new Date())/86400000)}function field(label,name,type='text',required=true){return `<label>${label}</label><input name="${name}" type="${type}" ${required?'required':''}>`}function propertySelect(){return `<label>Property</label><select name="property" required>${db.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>`}function table(rows,cols){return `<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function form(title,html,type){return `<div class="panel"><h2>${title}</h2><form data-type="${type}">${html}<p><button class="primary" type="submit">Save record</button></p></form></div>`}function render(){document.getElementById('tabs').innerHTML=sections.map(s=>`<button class="${s===tab?'active':''}" data-tab="${s}">${s}</button>`).join('');let html='';if(tab==='Cloud Properties'){html=`<div class="panel"><h2>☁️ Supabase connection — test area</h2><p><small>This is a separate cloud test. Other app tabs still store records on this device. Use dummy properties only.</small></p><p id="cloudStatus">Checking sign-in…</p><div id="cloudLogin"><form id="cloudLoginForm"><label>Email</label><input id="cloudEmail" type="email" autocomplete="username" required><label>Password</label><input id="cloudPassword" type="password" autocomplete="current-password" required><p><button class="primary">Sign in to Supabase</button></p></form></div><div id="cloudWorkspace" class="hidden"><button type="button" id="cloudLogout">Sign out</button><h3>Add dummy property</h3><form id="cloudPropertyForm"><label>Property name</label><input name="property_name" required placeholder="TEST PROPERTY ONLY"><label>Address</label><input name="address" required placeholder="TEST ADDRESS ONLY"><label>Note (optional)</label><textarea name="note"></textarea><p><button class="primary">Save to Supabase</button></p></form><h3>Properties stored in Supabase</h3><div id="cloudList"></div><button type="button" id="cloudRefresh">Refresh cloud records</button></div><p id="cloudMessage" role="status"></p></div>`;setTimeout(cloudRender,0)}if(tab==='Dashboard'){let rows=db.properties.map(p=>({...p,due:dateDue(p),remaining:days(dateDue(p))}));let overdue=rows.filter(r=>r.remaining<0).length,soon=rows.filter(r=>r.remaining>=0&&r.remaining<=30).length;let tile=(title,sub,target,icon,cls='')=>`<button type="button" class="home-tile ${cls}" data-tab="${target}"><span class="home-icon">${icon}</span><span class="home-tile-copy"><b>${title}</b><small>${sub}</small></span><span class="home-arrow">›</span></button>`;html=`<section class="home-hero"><div class="home-eyebrow">PARAMOUNT FIRE PROTECTION</div><h2>Engineer <span>Dashboard</span></h2><p>Your field service workspace</p><div class="home-status"><span class="home-dot"></span> Service management · Prototype</div></section><div class="home-heading"><h3>Start a service</h3><small>Select a task to get started</small></div><section class="home-services">${tile('Fire Alarm','Service records','Service Records','♨','fire')}${tile('PAT Testing','Appliance testing','PAT Testing','⚡','pat')}${tile('Emergency Lighting','Inspection & tests','Emergency Lighting','☀','lighting')}</section><div class="home-heading"><h3>Manage your work</h3></div><section class="home-management">${tile('Properties','Site information','Properties','⌂')}${tile('Service History','Records & reports','Service Records','▤')}${tile('Quotes & Invoices','Prepare documents','Quotes','£')}${tile('Job Planner','Visits & due dates','Planner','▦')}</section><section class="home-panels"><div class="home-panel"><div class="home-panel-title"><h3>Jobs & Reports</h3><button type="button" data-tab="Job Packs">Open →</button></div><p>Create a job pack and printable draft invoice after completing work.</p><div class="home-figure">${db.jobs.length}<small>Job packs recorded locally</small></div></div><div class="home-panel"><div class="home-panel-title"><h3>Upcoming Servicing</h3><button type="button" data-tab="Planner">View planner →</button></div><div class="home-summary"><div><strong>${overdue}</strong><small>Overdue</small></div><div><strong>${soon}</strong><small>Due within 30 days</small></div></div>${rows.sort((a,b)=>a.remaining-b.remaining).slice(0,3).map(r=>`<div class="home-due"><span>${esc(r.name)}</span><b>${r.remaining<0?'Overdue':r.remaining+' days'}</b></div>`).join('')}<p class="home-disclaimer">Automatic reminders are not active yet.</p></div></section><section class="home-extra">${tile('Documents','Templates & downloads','Documents','▧')}${tile('Cloud Properties','Supabase test area','Cloud Properties','☁')}</section><div class="home-ai">✦ <strong>AI Assistant</strong><span>Coming later</span></div><nav class="home-nav" aria-label="Quick navigation"><button type="button" data-tab="Dashboard">⌂<small>Home</small></button><button type="button" data-tab="Job Packs">▣<small>Jobs</small></button><button type="button" data-tab="Properties">▤<small>Properties</small></button><button type="button" data-tab="Documents">▧<small>Documents</small></button></nav>`}if(tab==='Properties'){html=form('Add property',field('Property name / address','name')+field('Postcode (for grouping)','postcode','text',false)+field('Panel make / model','panel')+field('Last service date','last','date')+`<label>Service interval (months — confirm from service contract)</label><input name="months" type="number" min="1" max="60" value="6" required>`,'properties')+`<div class="panel"><h2>Properties (${db.properties.length})</h2>${table(db.properties,[['Property',r=>r.name],['Postcode',r=>r.postcode||'—'],['Panel',r=>r.panel],['Last service',r=>r.last]])}</div>`}if(tab==='Service Records'){html=form('New service record (draft)',propertySelect()+field('Engineer','engineer')+field('Service date','date','date')+`<label>Battery inspection</label><select name="battery"><option>Not recorded</option><option>Satisfactory</option><option>Unsatisfactory</option><option>Not applicable</option></select><label>Device testing</label><select name="devices"><option>Not recorded</option><option>Satisfactory</option><option>Unsatisfactory</option><option>Not applicable</option></select><label>Faults / observations</label><textarea name="notes"></textarea>`,'services')+`<div class="panel"><h2>Draft service records</h2>${table(db.services,[['Property',r=>lookup(r.property)],['Date',r=>r.date],['Engineer',r=>r.engineer],['Notes',r=>r.notes]])}<small>Not a compliant certificate. Actual template and engineer approval to be added.</small></div>`}if(tab==='Inventory'){html=form('Add site equipment',propertySelect()+field('Equipment type','item')+field('Location / zone','location')+field('Quantity','qty','number')+field('Make / model','model','text',false),'inventory')+`<div class="panel"><h2>Equipment register</h2>${table(db.inventory,[['Property',r=>lookup(r.property)],['Equipment',r=>r.item],['Location',r=>r.location],['Qty',r=>r.qty]])}</div>`}if(tab==='PAT Testing'){html=`<div class="panel"><h2>⚡ Quick PAT testing</h2><p class="muted">Choose the property, tap a result for each appliance, and add duplicates with +. Leave items untested until you have actually tested them.</p><label>Property</label><select id="patProperty">${db.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><div class="patgrid"><label>Engineer<input id="patEngineer" placeholder="Engineer name"></label><label>Test date<input id="patDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"></label></div><div class="pattoolbar"><button type="button" data-add-pat="">+ Other appliance</button><button type="button" data-add-all="">+ Add standard list</button><button type="button" data-clear-pat="">Clear unsaved list</button></div><div id="patRows"></div><p id="patSummary" class="patcount"></p><button class="primary" type="button" data-save-pat="">Save completed tests</button><p><small>Record asset IDs, electrical class, appropriate test readings and defects. Not all appliances require the same electrical tests; this is a data-entry aid, not an automatic safety assessment or certificate.</small></p></div><div class="panel"><h2>Saved PAT records (${db.pat.length})</h2>${table(db.pat.slice().reverse(),[['Property',r=>lookup(r.property)],['Date',r=>r.date],['Asset',r=>r.asset],['Appliance',r=>r.item],['Result',r=>r.result]])}<p><button type="button" data-export-pat="">Export PAT CSV</button></p></div>`;setTimeout(renderPatRows,0)}if(tab==='Emergency Lighting'){html=form('Emergency lighting inspection / test (draft)',propertySelect()+field('Engineer','engineer')+field('Test date','date','date')+`<label>Test type</label><select name="testType"><option>Monthly functional</option><option>Annual full duration</option><option>Other / remedial</option></select><label>Fittings checked</label><input na if(tab==='Planner'){const all=planRows();const sorted=all.slice().sort((a,b)=>a.due.localeCompare(b.due));html=`<div class="panel"><h2>🗺️ Location-based service planner</h2><p class="muted">Group work by postcode area while keeping each service due date visible. Suggestions are not live road routes or confirmed bookings.</p><label>Show due through</label><input id="planUntil" type="month" value="${new Date().toISOString().slice(0,7)}"><button type="button" data-plan-filter>Show work for this month</button><div id="planOutput">${planHtml(sorted)}</div><small>Enter postcodes and due dates in each property's schedule. Use the same visit for compatible work, but never extend a required deadline.</small></div><div class="panel"><h2>Set property service schedules</h2><form data-type="schedule">${propertySelect()}<label>Service type</label><select name="kind"><option value="fire">Fire alarm service</option><option value="pat">PAT testing</option><option value="lighting">Emergency lighting</option></select>${field('Next due date','due','date')}<label>Estimated time on site (minutes)</label><input name="minutes" type="number" min="5" value="60"><p><button class="primary">Save due date</button></p></form></div>`}
