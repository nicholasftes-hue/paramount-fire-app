<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Paramount Fire Protection | Service Hub</title><style>body{font:16px system-ui;background:#101827;color:#eef2f7;margin:0}header{background:#17243a;padding:22px}h1{font-size:23px;margin:0}main{max-width:900px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button{background:#263b59;color:white;border:1px solid #456080;border-radius:9px;padding:11px;cursor:pointer}.tabs button.active{background:#2866a1}.panel{background:#1b2a40;border:1px solid #34465e;border-radius:12px;padding:18px;margin-top:15px}label{display:block;margin:10px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #718096;background:#f7fafc;color:#152238}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #44536a;padding:10px}small{color:#c4cfdf}.hidden{display:none}.cards{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#263b59;border-radius:9px;padding:14px;flex:1;min-width:120px}.stat strong{font-size:26px;display:block}.danger{color:#ffaaa5}.warn{color:#ffdc8b}button.primary{background:#147d74}button:focus{outline:2px solid white}</style></head><body><header><h1>🛡️ Paramount Fire Protection</h1><small>Service Hub · Prototype — stored on this device only</small></header><main><div class="tabs" id="tabs"></div><div id="view"></div></main><script>
const sections=['Dashboard','Properties','Service Records','Inventory','PAT Testing','Quotes'];let tab='Dashboard';const key='paramount-demo-v1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch(e){}db=db||{properties:[{id:'P001',name:'Demo HMO — Bury',panel:'C-TEC Conventional',last:'2026-04-21',months:6},{id:'P002',name:'Demo HMO — Bolton',panel:'Conventional panel',last:'2026-05-02',months:6}],services:[],inventory:[],pat:[],quotes:[]};function save(){localStorage.setItem(key,JSON.stringify(db));render()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateDue(p){let d=new Date(p.last+'T12:00:00');d.setMonth(d.getMonth()+Number(p.months));return d}function days(d){return Math.ceil((d-new Date())/86400000)}function field(label,name,type='text',required=true){return `<label>${label}</label><input name="${name}" type="${type}" ${required?'required':''}>`}function propertySelect(){return `<label>Property</label><select name="property" required>${db.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>`}function table(rows,cols){return `<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function form(title,html,type){return `<div class="panel"><h2>${title}</h2><form data-type="${type}">${html}<p><button class="primary" type="submit">Save record</button></p></form></div>`}function render(){document.getElementById('tabs').innerHTML=sections.map(s=>`<button class="${s===tab?'active':''}" data-tab="${s}">${s}</button>`).join('');let html='';if(tab==='Dashboard'){let rows=db.properties.map(p=>({...p,due:dateDue(p),remaining:days(dateDue(p))}));html=`<div class="panel"><h2>Servicing overview</h2><div class="cards"><div class="stat"><strong>${rows.filter(p=>p.remaining<0).length}</strong>Overdue</div><div class="stat"><strong>${rows.filter(p=>p.remaining>=0&&p.remaining<=7).length}</strong>Due in 7 days</div><div class="stat"><strong>${rows.filter(p=>p.remaining>=0&&p.remaining<=30).length}</strong>Due in 30 days</div></div><p><small>Planned reminders: 30 days and 7 days before due. Automatic notifications are not active in this prototype.</small></p>${table(rows.sort((a,b)=>a.remaining-b.remaining),[['Property',r=>r.name],['Panel',r=>r.panel],['Next due',r=>r.due.toLocaleDateString('en-GB')],['Status',r=>r.remaining<0?'Overdue':r.remaining<=7?'Due this week':r.remaining<=30?'Due this month':'Scheduled']])}</div>`}if(tab==='Properties'){html=form('Add property',field('Property name / address','name')+field('Panel make / model','panel')+field('Last service date','last','date')+`<label>Service interval (months — confirm from service contract)</label><input name="months" type="number" min="1" max="60" value="6" required>`,'properties')+`<div class="panel"><h2>Properties (${db.properties.length})</h2>${table(db.properties,[['Property',r=>r.name],['Panel',r=>r.panel],['Last service',r=>r.last]])}</div>`}if(tab==='Service Records'){html=form('New service record (draft)',propertySelect()+field('Engineer','engineer')+field('Service date','date','date')+`<label>Battery inspection</label><select name="battery"><option>Not recorded</option><option>Satisfactory</option><option>Unsatisfactory</option><option>Not applicable</option></select><label>Device testing</label><select name="devices"><option>Not recorded</option><option>Satisfactory</option><option>Unsatisfactory</option><option>Not applicable</option></select><label>Faults / observations</label><textarea name="notes"></textarea>`,'services')+`<div class="panel"><h2>Draft service records</h2>${table(db.services,[['Property',r=>lookup(r.property)],['Date',r=>r.date],['Engineer',r=>r.engineer],['Notes',r=>r.notes]])}<small>Not a compliant certificate. Actual template and engineer approval to be added.</small></div>`}if(tab==='Inventory'){html=form('Add site equipment',propertySelect()+field('Equipment type','item')+field('Location / zone','location')+field('Quantity','qty','number')+field('Make / model','model','text',false),'inventory')+`<div class="panel"><h2>Equipment register</h2>${table(db.inventory,[['Property',r=>lookup(r.property)],['Equipment',r=>r.item],['Location',r=>r.location],['Qty',r=>r.qty]])}</div>`}if(tab==='PAT Testing'){html=form('Add PAT test record',propertySelect()+field('Appliance / description','item')+field('Asset ID','asset')+field('Test date','date','date')+`<label>Result</label><select name="result"><option>Pass</option><option>Fail</option><option>Further assessment required</option></select>`+field('Test notes / readings','notes','text',false),'pat')+`<div class="panel"><h2>PAT register</h2>${table(db.pat,[['Property',r=>lookup(r.property)],['Asset',r=>r.asset],['Appliance',r=>r.item],['Result',r=>r.result]])}<small>Record only; not yet a formal PAT report.</small></div>`}if(tab==='Quotes'){html=form('Draft quotation',propertySelect()+field('Work description','description')+field('Materials (£)','materials','number')+field('Labour (£)','labour','number')+`<label>VAT rate (%)</label><input type="number" name="vat" value="20" min="0" max="100" required>`,'quotes')+`<div class="panel"><h2>Draft quotations</h2>${table(db.quotes,[['Property',r=>lookup(r.property)],['Work',r=>r.description],['Total',r=>'£'+((Number(r.materials)+Number(r.labour))*(1+Number(r.vat)/100)).toFixed(2)]])}<small>Prices are manually entered; AI drafting and approval workflow will come later.</small></div>`}document.getElementById('view').innerHTML=html}function lookup(id){return db.properties.find(p=>p.id===id)?.name||id}document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}});document.addEventListener('submit',e=>{let f=e.target.closest('form[data-type]');if(!f)return;e.preventDefault();let type=f.dataset.type;let data=Object.fromEntries(new FormData(f).entries());if(type==='properties')data.id='P'+String(Date.now());db[type].push(data);save()});render();if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});</script></body></html>
