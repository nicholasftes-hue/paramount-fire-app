name: Main app and Academy checks
on:
  pull_request:
    branches: [main, paramount-academy-update, paramount-main-app-development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  academy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm test
      - run: google-chrome --version
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: npm run test:main-browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0 python-docx==1.2.0 pypdf==6.1.1
      - run: python tests/templates.py
      - run: python tests/academy-browser.py --browser chromium
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - name: Test isolated demo engineering workflows
        run: npm run test:main-browser
        env:
          PARAMOUNT_APP_ROOT: /tmp/paramount-mark-demo-check/site
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - name: Test isolated demo offline and mobile layouts
        run: node tests/demo-browser.cjs
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: paramount-mark-demo-isolated
          path: /tmp/paramount-mark-demo-check/paramount-mark-demo-2026-10-27.zip
      - name: Package complete source backup
        run: |
          git archive --format=zip --output=paramount-main-app-backup.zip HEAD
          sha256sum paramount-main-app-backup.zip > paramount-main-app-backup.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: paramount-main-app-source-backup
          path: |
            paramount-main-app-backup.zip
            paramount-main-app-backup.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-browser-results
          path: test-results/
          if-no-files-found: ignore

