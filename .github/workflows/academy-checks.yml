name: Main app and Academy checks
on:
  pull_request:
    branches: [main, paramount-academy-update]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  academy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Dependency security audit
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - run: npm test
      - run: google-chrome --version
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        run: npm run test:main-browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        run: npm run test:certificates-browser
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        run: node tests/team-sync-browser.cjs
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        run: node tests/signature-browser.cjs
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: ${{ !cancelled() }}
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 python-docx==1.2.0 pypdf==6.1.1
      - if: ${{ !cancelled() }}
        run: python tests/populated-documents.py
      - if: ${{ !cancelled() }}
        run: python tests/templates.py
      - if: ${{ !cancelled() }}
        run: python tests/service-pdf.py
      - if: ${{ !cancelled() }}
        run: python tests/controlled-pdf.py
      - if: ${{ !cancelled() }}
        run: python tests/academy-browser.py --browser chromium
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - name: Package complete source backup
        run: |
          git archive --format=zip --output=paramount-main-app-backup.zip HEAD
          sha256sum paramount-main-app-backup.zip > paramount-main-app-backup.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: paramount-main-app-source-backup
          path: |
            paramount-main-app-backup.zip
            paramount-main-app-backup.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-browser-results
          path: test-results/
          if-no-files-found: ignore





  isolated-sync-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paramount_sync_test
          POSTGRES_PASSWORD: fictional-local-test
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/team-sync-db.py


